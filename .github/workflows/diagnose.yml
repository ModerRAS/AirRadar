name: diagnose

on:
  workflow_dispatch:
    inputs:
      script_b64:
        description: "Base64-encoded bash script to run on the Swarm manager (diagnostics only)"
        required: true
        default: "ZWNobyA9PT0gc2VydmljZSA9PT07IGRvY2tlciBzZXJ2aWNlIHBzIGFpcnJhZGFyX2FpcnJhZGFyIC0tbm8tdHJ1bmM7IGRvY2tlciBzZXJ2aWNlIGxvZ3MgLS10YWlsIDgwIGFpcnJhZGFyX2FpcnJhZGFy"

permissions:
  contents: read

jobs:
  diagnose:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Run diagnostic script over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: false
          script: |
            echo "${{ inputs.script_b64 }}" | base64 -d | bash -s
