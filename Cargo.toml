[package]
name = "airradar"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "AirRadar - self-hosted anime airing schedule index for MiruPlay"
license = "MIT"
repository = "https://github.com/ModerRAS/AirRadar"
readme = "README.md"
default-run = "airradar"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
encoding_rs = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "fs", "net"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
